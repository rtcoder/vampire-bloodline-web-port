<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Vampire Bloodline — przegląd remasteru</title><style>body{background:#17151b;color:#eee;font:14px system-ui;margin:24px}h1{font-size:22px}button,select{background:#302934;color:white;padding:8px;border:1px solid #756174;margin-right:12px}#sequences{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin:16px 0}.sequence{padding:12px;background:#25222a}.sequence h2{font-size:13px;margin:0 0 8px}.labels{display:flex;justify-content:space-around;font-size:11px;color:#bbb}canvas{width:100%;image-rendering:auto}#statics{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}figure{margin:0;background:#25222a;padding:12px}figure img{max-width:100%;display:block;background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0/16px 16px}figcaption{margin:8px 0}.muted{color:#aaa}a{color:#fca}</style><h1>Vampire Bloodline — kontrola grafiki AI ×4</h1><p>Ta sama siatka klatek i alpha: oryginał → baseline nearest-neighbor → FSRCNN ×4. Linie wskazują początek wycinka i źródłowy offset. Podgląd 100 ms/klatkę; faktyczne czasy akcji wynikają ze stanu gry.</p><button id="pause">Pauza</button><select id="background"><option value="checker">Szachownica</option><option value="black">Czarne tło</option><option value="white">Białe tło</option></select><span id="tick" class="muted"></span><section id="sequences"></section><h1>Wszystkie 25 arkuszy</h1><section id="statics"></section><script type="module">
const meta=await fetch('data/frames.json').then(r=>r.json()),manifest=await fetch('data/asset-manifest.json').then(r=>r.json());const imgs={};for(const a of manifest.assets){imgs[a.id]={};for(const [m,p]of Object.entries({original:a.original,baseline:a.baseline4x,ai:a.remastered4x})){const img=new Image;img.src=p;await img.decode();imgs[a.id][m]=img}}
let paused=false,time=0,last=performance.now(),mode='checker';document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Wznów':'Pauza'};document.querySelector('#background').onchange=e=>mode=e.target.value;const cells=[];for(const [id,a]of Object.entries(meta.animations)){if(id.endsWith('.tiles'))continue;const el=document.createElement('article');el.className='sequence';el.innerHTML='<h2>'+id+'</h2><div class="labels"><span>Oryginał</span><span>Baseline NN</span><span>FSRCNN ×4</span></div><canvas width="576" height="192"></canvas>';document.querySelector('#sequences').append(el);cells.push({id,a,ctx:el.querySelector('canvas').getContext('2d')})}
function draw(now){if(!paused)time+=now-last;last=now;const tick=Math.floor(time/100);document.querySelector('#tick').textContent='Klatka przeglądu: '+tick;for(const {id,a,ctx:c}of cells){const pw=(id.startsWith('sword.')||id.startsWith('stuff.slash'))?384:192;const ch=id==='stuff.column_700'?320:192;if(c.canvas.width!==pw*3)c.canvas.width=pw*3;if(c.canvas.height!==ch)c.canvas.height=ch;c.fillStyle=mode==='white'?'#fff':'#000';c.fillRect(0,0,pw*3,ch);if(mode==='checker')for(let y=0;y<ch;y+=16)for(let x=0;x<pw*3;x+=16){c.fillStyle=(x/16+y/16)%2?'#303037':'#202026';c.fillRect(x,y,16,16)}const cycle=a.durationTicks?.reduce((s,v)=>s+v,0)||a.frames.length;let fi=tick%a.frames.length;if(a.durationTicks){let k=tick%cycle;fi=0;while(k>=a.durationTicks[fi])k-=a.durationTicks[fi++]}const f=meta.frames[a.frames[fi]],r=f.rect,ofs=a.offsets?.[fi]||f.offset;for(const [i,m]of ['original','baseline','ai'].entries()){const scale=m==='original'?1:4;c.imageSmoothingEnabled=false;const dx=i*pw+(id.startsWith('sword.')?176:64)+ofs[0]*4,dy=40+ofs[1]*4;c.save();if(a.clipRects){const q=a.clipRects[fi];c.beginPath();c.rect(dx+q[0]*4,dy+q[1]*4,q[2]*4,q[3]*4);c.clip()}for(let repeat=0;repeat<(a.repeatCounts?.[fi]||1);repeat++)c.drawImage(imgs[f.asset][m],r[0]*scale,r[1]*scale,r[2]*scale,r[3]*scale,dx,dy+repeat*r[3]*4,r[2]*4,r[3]*4);c.restore();c.strokeStyle='#58859a';c.beginPath();c.moveTo(i*pw+(id.startsWith('sword.')?176:64),0);c.lineTo(i*pw+(id.startsWith('sword.')?176:64),ch);c.moveTo(i*pw,168);c.lineTo((i+1)*pw,168);c.stroke()}c.fillStyle=mode==='white'?'black':'white';c.font='11px monospace';c.fillText(a.frames[fi],4,187)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
for(const a of manifest.assets){const f=document.createElement('figure');f.innerHTML='<figcaption>'+a.id+' — '+a.width+'×'+a.height+' → '+a.width*4+'×'+a.height*4+'</figcaption><div>Baseline NN</div><img src="'+a.baseline4x+'"><div>FSRCNN ×4</div><img src="'+a.remastered4x+'">';document.querySelector('#statics').append(f)}window.reviewReady=true;window.reviewSequences=cells.length;
</script></html>
